/* ---------- ekrana sığdır ---------- */
function fit(){
  const r=Math.min(innerWidth/W, innerHeight/H);
  canvas.style.width=Math.floor(W*r)+'px';
  canvas.style.height=Math.floor(H*r)+'px';
}
addEventListener('resize',fit); fit();

/* ---------- girdi ---------- */
let mx=-99,my=-99,click=null;
const pressed={};
canvas.addEventListener('pointermove',e=>{
  const r=canvas.getBoundingClientRect();
  mx=(e.clientX-r.left)/r.width*W;
  my=(e.clientY-r.top)/r.height*H;
});
canvas.addEventListener('pointerdown',e=>{
  initAudio();
  const r=canvas.getBoundingClientRect();
  mx=(e.clientX-r.left)/r.width*W;
  my=(e.clientY-r.top)/r.height*H;
  click={x:mx,y:my};
});
addEventListener('keydown',e=>{
  if(e.repeat)return;
  initAudio();
  const k=e.key.toLowerCase();
  if(k==='enter'||k===' '){pressed.enter=true;e.preventDefault();}
  if(k==='c')pressed.c=true;
  if(k==='m')pressed.m=true;
});

/* ---------- ses (chiptune efektleri) ---------- */
let AC=null, muted=false;
function initAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,dur,type,vol,delay,slideTo){
  if(muted||!AC)return;
  type=type||'square'; vol=(vol==null)?0.12:vol; delay=delay||0;
  const t0=AC.currentTime+delay;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0);
  if(slideTo)o.frequency.linearRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}

  hata  :()=>{tone(196,.2,'sawtooth',.14);tone(147,.3,'sawtooth',.14,.08);},
  kacir :()=>{tone(392,.15,'sawtooth',.13);tone(311,.2,'sawtooth',.13,.12);tone(233,.32,'sawtooth',.13,.24);},
  kapi  :()=>{tone(330,.06,'square',.06);tone(392,.08,'square',.06,.07);},
  sarki :()=>{[392,494,587,784].forEach((f,i)=>tone(f,.12,'square',.09,i*.11));},
  kovul :()=>tone(300,.6,'sawtooth',.15,0,60),
  tik   :()=>tone(1050,.03,'square',.05),
  azar  :()=>{tone(233,.12,'square',.12);tone(208,.12,'square',.12,.1);tone(196,.16,'square',.12,.2);},
  selam :()=>{tone(660,.07,'square',.09);tone(880,.1,'square',.09,.08);},

/* ---------- çizim yardımcıları ---------- */
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function txt(s,x,y,size,color,align){
  ctx.font=(size||8)+'px "Press Start 2P", monospace';
  ctx.fillStyle=color||'#fff';
  ctx.textAlign=align||'left';
  ctx.textBaseline='top';
  ctx.fillText(s,x,y);
}
function txtG(s,x,y,size,color,align){ // gölgeli yazı
  txt(s,x+2,y+2,size,'#000',align);
  txt(s,x,y,size,color,align);
}
function drawSprite(rows,pal,x,y,sc,alpha){
  if(alpha!=null)ctx.globalAlpha=alpha;
  for(let r=0;r<rows.length;r++){
    const row=rows[r];
    for(let c=0;c<row.length;c++){
      const ch=row[c];
      if(ch==='.')continue;
      const col=pal[ch];
      if(!col)continue;
      rect(x+c*sc,y+r*sc,sc,sc,col);
    }
  }
  if(alpha!=null)ctx.globalAlpha=1;
}
function tri(x1,y1,x2,y2,x3,y3,c){
  ctx.fillStyle=c;ctx.beginPath();
  ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);
  ctx.closePath();ctx.fill();
}

/* ---------- MCT (uzun boylu, kilolu, kısa saçlı) ---------- */
const SKIN='#f2c09a', SKIN_D='#d89a72', HAIR_C='#3a2c20', WALL='#b9c6d4';
function mctBob(mood,t){
  if(mood==='mutlu')return {br:0,jig:Math.round(Math.abs(Math.sin(t*7))*2)};
  return {br:Math.round(Math.sin(t*1.7)),jig:0}; // nefes alma
}
function drawMCT(t,mood){
  const cx=655;
  const b=mctBob(mood,t);
  const by=144+b.br-b.jig;
  // gövde (bol beyaz gömlek)
  rect(cx-46,by,92,46,'#f2f2ee');
  rect(cx-46,by+8,10,38,'#dcdcd4');
  rect(cx+36,by+8,10,38,'#dcdcd4');
  // omuz yuvarlamaları (arka duvar rengiyle köşe kırp)
  rect(cx-46,by,5,5,WALL); rect(cx+41,by,5,5,WALL);
  rect(cx-45,by+1,3,3,WALL); rect(cx+42,by+1,3,3,WALL);
  // yaka + kravat
  rect(cx-14,by,28,6,'#ffffff');
  rect(cx-6,by+2,12,10,'#c03028');
  rect(cx-5,by+12,10,40,'#c03028');
  rect(cx-5,by+12,3,40,'#e06058');
  // göğüs cebi + kalem
  rect(cx-36,by+20,15,11,'#dcdcd4');
  rect(cx-32,by+18,3,13,'#2a5ac0');
  // kafa
  const hy=102+b.br-b.jig;
  rect(cx-19,hy,38,36,SKIN);
  rect(cx-24,hy+12,5,10,SKIN); rect(cx+19,hy+12,5,10,SKIN); // kulaklar
  rect(cx-19,hy,38,8,HAIR_C);                                 // kısa saç
  rect(cx-19,hy,4,15,HAIR_C); rect(cx+15,hy,4,15,HAIR_C);     // favoriler
  // gözler (kırpma dahil) + kaşlar
  const blink=(t%3.7)<0.12;
  if(!blink){
    rect(cx-13,hy+13,6,7,'#2a1a10'); rect(cx+7,hy+13,6,7,'#2a1a10');
    rect(cx-12,hy+14,2,2,'#fff');    rect(cx+8,hy+14,2,2,'#fff');
  }else{
    rect(cx-13,hy+15,6,3,'#2a1a10'); rect(cx+7,hy+15,6,3,'#2a1a10');
  }
  if(mood==='uzgun'){
    rect(cx-14,hy+9,9,3,'#2a1a10'); rect(cx+5,hy+9,9,3,'#2a1a10');
    rect(cx-12,hy+12,6,2,'#2a1a10'); rect(cx+8,hy+12,6,2,'#2a1a10');
  }else{
    rect(cx-14,hy+9,9,3,'#2a1a10'); rect(cx+5,hy+9,9,3,'#2a1a10');
  }
  // burun
  rect(cx-4,hy+18,8,9,SKIN_D);
  // ağız (ruh haline göre)
  if(mood==='mutlu'){
    rect(cx-8,hy+26,16,8,'#5a2a1a');
    rect(cx-5,hy+31,10,3,'#e06060');
  }else if(mood==='uzgun'){
    rect(cx-7,hy+30,14,3,'#5a2a1a');
    rect(cx-9,hy+29,2,2,'#5a2a1a'); rect(cx+7,hy+29,2,2,'#5a2a1a');
    rect(cx+17,hy+8,4,8,'#7ec8e3'); // ter damlası
  }else{
    rect(cx-7,hy+27,14,4,'#7a3a2a');
    rect(cx-9,hy+26,2,2,'#7a3a2a'); rect(cx+7,hy+26,2,2,'#7a3a2a');
  }
}
function drawEller(t,mood){ // masanın üstündeki eller (masadan sonra çizilir)
  const cx=655;

const MUSTERILER=[

const ERMEYEN_CFG={ad:'ERMEYEN BEY',skin:'#e8b48c',hair:'#4a4a4a',top:'#3a3a4a',pant:'#2a2a3a',kravat:'#8a1a1a',azar:true};
const SAMUT_CFG={ad:'SAMUT ABİ',skin:'#d89868',hair:'#2a2a2a',biyik:'#2a2a2a',top:'#4a6ab0',pant:'#3a4a6a',kutu:true};
const MUHASEBE_CFG={ad:'MUHASEBECİ ABLA',skin:'#f2c09a',bun:'#3a2a1a',dress:'#7a4a9a',gozluk:true};
function drawCustomer(c,t){
  const cfg=c.cfg, x=Math.round(c.x), footY=c.footY||196;
  const kid=!!cfg.cocuk;
  const hw=kid?18:24;          // kafa genişliği
  const th=kid?22:32;          // gövde yüksekliği
  const lh=kid?20:28;          // bacak yüksekliği
  const bw=kid?26:34;          // gövde genişliği
  const top=footY-(hw+th+lh);
  const walking=(c.sub==='in'||c.sub==='out');
  const ph=walking?(Math.floor(t*8)%2):0;
  const y=top-(walking&&ph?1:0);
  const mood=c.cMood||'normal';
  const legY=y+hw+th;
  // bacaklar
  if(cfg.dress){
    rect(x-6,legY,5,lh,cfg.skin); rect(x+1,legY,5,lh,cfg.skin);
  }else{
    rect(x-9+(ph?2:0),legY,8,lh,cfg.pant);
    rect(x+1-(ph?2:0),legY,8,lh,cfg.pant);
  }
  // ayakkabılar
  rect(x-9+(walking&&ph?2:0),footY-4,8,4,'#2a2a2a');
  rect(x+1-(walking&&ph?2:0),footY-4,8,4,'#2a2a2a');
  // gövde
  if(cfg.dress){
    rect(x-bw/2,y+hw-2,bw,th+6,cfg.dress);
    rect(x-bw/2-4,legY-4,bw+8,8,cfg.dress); // etek ucu
    if(cfg.onluk)rect(x-7,y+hw+4,14,th+2,'#f4f0e0');
  }else{
    rect(x-bw/2,y+hw-2,bw,th+2,cfg.top);
    if(cfg.kravat)rect(x-3,y+hw+4,6,th-8,cfg.kravat);
  }
  // kollar (yürürken sallanır)
  const armY=y+hw+2, armH=th-4;
  const swing=walking?(ph?2:-2):0;
  const armC=cfg.dress||cfg.top||'#888';
  rect(x-bw/2-5,armY+swing,6,armH,armC);
  rect(x+bw/2-1,armY-swing,6,armH,armC);
  rect(x-bw/2-5,armY+armH+swing-2,6,5,cfg.skin);
  rect(x+bw/2-1,armY+armH-swing-2,6,5,cfg.skin);
  // Samut abinin sevkiyat kutusu
  if(cfg.kutu){
    rect(x-12,y+hw+4,24,20,'#b8874a');
    rect(x-12,y+hw+4,24,4,'#a0703a');
    rect(x-2,y+hw+10,4,10,'#8a5a24');
  }
  // kafa
  rect(x-hw/2,y,hw,hw,cfg.skin);
  // saç / başörtü / şapka / topuz
  if(cfg.scarf){
    rect(x-hw/2-2,y-2,hw+4,Math.floor(hw*0.55)+2,cfg.scarf);
    rect(x-hw/2-2,y-2,4,Math.floor(hw*0.8),cfg.scarf);
    rect(x+hw/2-2,y-2,4,Math.floor(hw*0.8),cfg.scarf);
    rect(x-hw/2-6,y+Math.floor(hw*0.35),5,6,cfg.scarf);
  }else if(cfg.cap){
    rect(x-hw/2,y-3,hw,9,cfg.cap);
    rect(x+hw/2-2,y+4,hw/2+7,3,cfg.cap); // siperlik (masaya doğru)
  }else if(cfg.hair){
    rect(x-hw/2,y-2,hw,8,cfg.hair);
    rect(x-hw/2,y-2,4,Math.floor(hw*0.7),cfg.hair);
    rect(x+hw/2-4,y-2,4,Math.floor(hw*0.7),cfg.hair);
    if(cfg.uzun){rect(x-hw/2-2,y,4,hw+10,cfg.hair);rect(x+hw/2-2,y,4,hw+10,cfg.hair);}
  }
  if(cfg.bun)rect(x-2,y-7,9,7,cfg.bun);
  // yüz
  const ey=y+Math.floor(hw*0.42);
  if(mood==='azar'){
    // Ermeyen Bey: çatık kaş + bağırarak konuşan ağız
    rect(x-9,ey-5,7,3,'#301810'); rect(x+2,ey-5,7,3,'#301810');
    rect(x-7,ey,5,5,'#301810');    rect(x+2,ey,5,5,'#301810');
    if(Math.floor(t*5)%2)rect(x-4,ey+9,9,5,'#5a2a1a');
    else rect(x-3,ey+10,7,4,'#5a2a1a');
  }else if(mood==='kizgin'){
    rect(x-9,ey-5,7,3,'#301810'); rect(x+2,ey-5,7,3,'#301810');
    rect(x-7,ey,5,5,'#301810');    rect(x+2,ey,5,5,'#301810');
    rect(x-6,ey+10,4,3,'#5a2a1a'); rect(x-1,ey+9,4,3,'#5a2a1a'); rect(x+4,ey+10,3,3,'#5a2a1a');
    ctx.globalAlpha=0.22; rect(x-hw/2,y,hw,hw,'#e03020'); ctx.globalAlpha=1;
    if(Math.floor(t*6)%2)rect(x-8,y-12,4,4,'#d8d8e8'); // buhar
  }else if(mood==='mutlu'){
    rect(x-8,ey,7,3,'#301810'); rect(x+1,ey,7,3,'#301810');
    rect(x-6,ey+8,12,4,'#5a2a1a');
    rect(x-8,ey+7,2,2,'#5a2a1a'); rect(x+6,ey+7,2,2,'#5a2a1a');
  }else{
    rect(x-7,ey,5,5,'#301810'); rect(x+2,ey,5,5,'#301810');
    if(c.sub==='talk'&&Math.floor(t*5)%2){rect(x-3,ey+9,7,5,'#5a2a1a');}
    else{rect(x-5,ey+10,11,3,'#5a2a1a');}
  }
  // gözlük (muhasebeci abla)
  if(cfg.gozluk){
    rect(x-10,ey-1,8,8,'#303040'); rect(x+2,ey-1,8,8,'#303040');
    rect(x-9,ey,6,6,'#cfe0f0');    rect(x+3,ey,6,6,'#cfe0f0');
    rect(x-8,ey+1,3,4,'#301810');  rect(x+4,ey+1,3,4,'#301810');
    rect(x-2,ey+2,4,1,'#303040');
  }
  if(cfg.biyik)rect(x-6,ey+6,13,4,cfg.biyik);
}

function drawBG(t){
  // duvar + süpürgelik + ahşap zemin
  rect(0,0,W,170,WALL);
  rect(0,162,W,8,'#8494a8');
  rect(0,170,W,80,'#a8712f');
  ctx.fillStyle='#8a5a24';
  for(let y=178;y<250;y+=14)ctx.fillRect(0,y,W,2);
  for(let y=170,r=0;y<250;y+=14,r++)for(let x=(r%2)*40;x<W;x+=80)ctx.fillRect(x,y,2,14);
  // pencere + bulutlar
  rect(124,32,150,90,'#f4f0e6');
  rect(132,40,134,74,'#7ec8e3');
  const bx=(t*7)%260;
  rect(150+bx*0.4,52,34,10,'#ffffff'); rect(160+bx*0.4,46,16,8,'#ffffff');
  rect(210+bx*0.2,86,30,10,'#ffffff'); rect(220+bx*0.2,80,14,8,'#ffffff');
  rect(196,40,6,74,'#f4f0e6'); rect(132,73,134,6,'#f4f0e6');
  rect(124,122,150,4,'#c8c2b0');
  // Çakmazoğlu Holding tabelası

function satirlaraBol(s,maxKarakter){
  const kelimeler=s.split(' ');
  const satirlar=[];
  let cur='';
  for(const kel of kelimeler){
    const dene=(cur?cur+' '+kel:kel);
    if(dene.length<=maxKarakter)cur=dene;
    else{if(cur)satirlar.push(cur);cur=kel;}
  }
  if(cur)satirlar.push(cur);
  return satirlar;
}

let hoverVar=false;
function hitTest(x,y,w,h){const h2=(mx>=x&&mx<=x+w&&my>=y&&my<=y+h);if(h2)hoverVar=true;return h2;}
function consumeClick(){if(click){click=null;return true;}return false;}

function miniBtn(x,y,s,label,enabled,color,border){
  const hov=enabled&&hitTest(x,y,s,s);
  ctx.fillStyle=hov?'#10240f':'rgba(0,0,0,0)';
  ctx.fillRect(x,y,s,s);
  ctx.strokeStyle=enabled?border:'#1c3a20';
  ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,s-2,s-2);
  txt(label,x+s/2,y+Math.floor((s-8)/2)+1,8,enabled?color:'#2a4a2c','center');
  return hov&&consumeClick();
}
function button(x,y,w,h,fill,fillHover,label,labelColor,disabled,border){
  const hov=!disabled&&hitTest(x,y,w,h);
  if(fill){
    ctx.fillStyle=disabled?'#2a3a2c':(hov&&fillHover?fillHover:fill);
    ctx.fillRect(x,y,w,h);
    if(border){ctx.strokeStyle=border;ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,w-2,h-2);}
    if(label)txt(label,x+w/2,y+Math.floor((h-8)/2)+1,8,disabled?'#5a7a5c':labelColor,'center');
  }else{
    if(hov){ctx.fillStyle='rgba(255,215,94,0.12)';ctx.fillRect(x,y,w,h);}
    ctx.strokeStyle=disabled?'#2a3a2c':border;
    ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,w-2,h-2);
    if(label)txt(label,x+w/2,y+Math.floor((h-8)/2)+1,8,disabled?'#5a7a5c':labelColor,'center');
  }
  return !disabled&&hov&&consumeClick();
}

function genOrder(gun){
  const havuz=unlockedVeggies(gun);
  const maxT=Math.min(1+Math.ceil(gun/2),5);
  const alt=Math.max(1,maxT-1);
  const n=Math.min(havuz.length, alt+Math.floor(Math.random()*(maxT-alt+1)));
  const kopya=havuz.slice();
  const order=[];
  for(let i=0;i<n;i++){
    const j=Math.floor(Math.random()*kopya.length);
    const v=kopya.splice(j,1)[0];
    const maxQ=Math.min(3+Math.ceil(gun/2),8);
    order.push({id:v.id, adet:1+Math.floor(Math.random()*maxQ)});
  }
  return order;
}

function doConfirm(){

  let adetToplam=0;
  for(const id in G.entered)adetToplam+=G.entered[id];
  if(adetToplam===0){
    G.panelMsg={t:1.2,text:'ÖNCE ADET GİR!',color:'#ff8a7a'};

  const dogru=order.every(it=>(G.entered[it.id]||0)===it.adet);
  const fazlalik=Object.keys(G.entered).some(id=>G.entered[id]>0&&!order.some(it=>it.id===id));
  if(dogru&&!fazlalik){
    const tutar=siparisToplam(order);
    const gecen=(c.patienceMax-c.patience)/c.patienceMax;
    let kazan=tutar, bahsis=0;
    if(gecen<0.5)bahsis=Math.ceil(tutar*0.2);

    c.cMood='mutlu'; G.mctMood='mutlu'; G.mctT=0;

    if(bahsis>0)G.floats.push({text:'HIZLI! BAHŞİŞ +'+bahsis+' TL',x:520,y:140,t:1.7,vy:-16,color:'#ffd75e'});

    G.panelMsg={t:1.6,text:'SİPARİŞ ONAYLANDI! +'+kazan+' TL',color:'#8dff9a'};
    sfx.tamam();
  }else{
    G.rep=Math.max(0,G.rep-15);
    G.gunYanlis++;
    c.cMood='kizgin'; G.mctMood='uzgun'; G.mctT=0;
    G.flashR=0.5; G.shake=5;
    G.floats.push({text:'İTİBAR -15',x:W-130,y:26,t:1.2,vy:-14,color:'#ff8a7a'});
    const istenen=order.map(i=>kodBul(i.id)+'x'+i.adet).join(' ');
    const girilen=Object.keys(G.entered).filter(id=>G.entered[id]>0)
                   .map(id=>kodBul(id)+'x'+G.entered[id]).join(' ')||'-';
    G.panelMsg={t:3,text:'HATA! İSTENEN: '+istenen+' / GİRDİĞİN: '+girilen,color:'#ff8a7a'};
    sfx.hata();
  }
  c.sub='out';
  if(G.rep<=0)G.fired=true;
}
/* ---------- güncelleme ---------- */
function update(dt){
  T+=dt; G.t+=dt;
  if(G.flashG>0)G.flashG-=dt;
  if(G.flashR>0)G.flashR-=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*14);
  if(G.panelMsg.t>0)G.panelMsg.t-=dt;
  for(const f of G.floats){f.t-=dt; f.y+=f.vy*dt;}
  G.floats=G.floats.filter(f=>f.t>0);
  // MCT'nin yüz ifadesi bir süre sonra normale döner
  if(G.mctMood!=='normal'){
    G.mctT+=dt;
    if(G.mctT>1.6){G.mctMood='normal';G.mctT=0;}
  }
  // tuşlar
  if(pressed.m)muted=!muted;
  if(pressed.enter){
    if(G.phase==='title')startGame();
    else if(G.phase==='dayintro'&&G.t>0.5)beginServe();
    else if(G.phase==='serve'&&G.cust&&G.cust.sub==='order')doConfirm();
    else if(G.phase==='dayend')startDay(G.day+1);
    else if(G.phase==='gameover')toTitle();
  }
  if(pressed.c)doClear();

  if(G.phase==='dayintro'){
    if(G.t>2.4)beginServe();
  }else if(G.phase==='serve'){
    const c=G.cust;
    if(!c){
      G.spawnDelay-=dt;
      if(G.spawnDelay<=0)spawnCustomer();
    }else if(c.sub==='in'){
      c.x+=130*dt;
      if(c.x>=380){c.x=380;c.sub='wait';c.t=0;}
    }else if(c.sub==='wait'){
      c.t+=dt;
      if(c.t>0.35){c.sub='talk';c.t=0;}
    }else if(c.sub==='talk'){
      c.greetN+=dt*38;
      if(c.greetN>=c.greet.length+8){c.sub='order';c.patience=c.patienceMax;}
    }else if(c.sub==='order'){
      c.patience-=dt;
      if(c.patience<=5&&c.patience>0&&Math.floor(c.patience)!==c.sonTik){
        c.sonTik=Math.floor(c.patience); sfx.tik();
      }
      if(c.patience<=0){
        G.rep=Math.max(0,G.rep-20);
        G.gunKacan++;
        c.cMood='kizgin'; G.mctMood='uzgun'; G.mctT=0;
        G.flashR=0.5; G.shake=4;
        G.floats.push({text:'MÜŞTERİ KAÇTI! İTİBAR -20',x:390,y:80,t:1.6,vy:-14,color:'#ff8a7a'});
        G.panelMsg={t:2.5,text:'SABIR TÜKENDİ! MÜŞTERİ KAÇTI!',color:'#ff8a7a'};
        sfx.kacir();
        c.sub='out';
        if(G.rep<=0)G.fired=true;
      }
    }else if(c.sub==='out'){
      c.x-=(c.cMood==='kizgin'?230:150)*dt;
      if(c.x<-60){
        G.cust=null; G.idx++;
        if(G.fired){
          G.phase='gameover'; G.t=0;
          G.yeniRekorF=yeniRekorKaydet();
          sfx.kovul();
        }else if(G.idx>=G.musteriSayisi){
          G.phase='dayend'; G.t=0;
          if(G.gunYanlis===0&&G.gunKacan===0){G.prima=true;G.money+=20;}
          G.yeniRekorF=yeniRekorKaydet();
          sfx.sarki();
        }else{
          G.spawnDelay=0.5;
        }
      }
    }
  }
  // arada uğrayan ziyaretçiler (Ermeyen Bey + Samut Abi)
  if(G.phase==='serve'){
    if(!G.ziyaretci){
      G.ermeyenSure-=dt;
      G.samutSure-=dt;
      if(G.ermeyenSure<=0){
        spawnZiyaretci('ermeyen');
        G.ermeyenSure=15;
      }else if(G.samutSure<=0){
        spawnZiyaretci('samut');
        G.samutSure=25+Math.random()*25;
      }
    }else{
      const z=G.ziyaretci;
      if(z.sub==='in'){
        z.x+=120*dt;
        if(z.x>=z.hedef){
          z.x=z.hedef; z.sub='talk';
          if(z.tip==='ermeyen')sfx.azar(); else sfx.selam();
        }
      }else if(z.sub==='talk'){
        z.sayiN+=dt*38;
        if(z.sayiN>=z.sayi.length){z.bekle+=dt; if(z.bekle>2.2)z.sub='out';}
      }else{
        z.x-=140*dt;
        if(z.x<-60)G.ziyaretci=null;
      }
    }
    // Ermeyen Bey içerideyken MCT üzgün görünür
    if(G.ziyaretci&&G.ziyaretci.tip==='ermeyen'&&G.ziyaretci.sub!=='out'){G.mctMood='uzgun';G.mctT=0;}
  }
  // Muhasebeci abla döngüsü: otur -> çık -> dışarıda bekle -> geri dön
  const mhb=G.muhasebe;
  if(mhb){
    mhb.footY+=(mhb.hedefFootY-mhb.footY)*Math.min(1,dt*8);
    if(mhb.durum==='otur'){
      mhb.sure-=dt;
      if(mhb.sure<=0){mhb.durum='cikiyor';mhb.sub='out';mhb.hedefFootY=174;}
    }else if(mhb.durum==='cikiyor'){
      mhb.x-=110*dt;
      if(mhb.x<10){mhb.durum='disarida';mhb.sure=6+Math.random()*8;}
    }else if(mhb.durum==='disarida'){
      mhb.sure-=dt;
      if(mhb.sure<=0){mhb.durum='donuyor';mhb.sub='in';mhb.x=-30;}
    }else if(mhb.durum==='donuyor'){
      mhb.x+=110*dt;
      if(mhb.x>=745){mhb.x=745;mhb.durum='otur';mhb.sub='';mhb.hedefFootY=188;mhb.sure=8+Math.random()*6;}
    }
  }
}

/* ---------- ekranlar ---------- */
function drawTitle(){
  rect(0,0,W,H,'#0e1226');
  for(let i=0;i<14;i++){ // düşen sebzeler (arka dekor)
    const vx=Math.floor((i*61+T*(14+i*4)+i*53)%W);
    const vy=Math.floor((T*(26+i*9)+i*97)%(H+40))-30;
    ctx.globalAlpha=0.16;
    drawVeg(VEGGIES[i%VEGGIES.length].id,vx,vy,2,false);
    ctx.globalAlpha=1;
  }
  txt('ÇAKMAZOĞLU HOLDİNG SUNAR',W/2,54,8,'#8890a0','center');
  txtG('SEBZECİ',W/2,88,24,'#ffffff','center');
  txt('MCT',W/2+5,130+5,48,'#701c14','center');
  txt('MCT',W/2,130,48,'#ffd75e','center');
  VEGGIES.forEach((v,i)=>{
    const yy=212+Math.round(Math.sin(T*3+i*0.8)*5);
    drawVeg(v.id,W/2-172+i*46,yy,2,false);
  });
  if(Math.floor(T*2)%2)txtG('BAŞLAMAK İÇİN TIKLA ya da ENTER',W/2,282,8,'#ffffff','center');
  txt('Müşteri siparişini oku, adetleri bilgisayara gir, ONAYLA de',W/2,328,8,'#7f89a6','center');
  txt('Sabrı tükenen müşteri kaçar, itibar düşer',W/2,346,8,'#7f89a6','center');
  txt('İtibar sıfırlanırsa MCT KOVULUR!',W/2,364,8,'#ff8a7a','center');
  if(REKOR)txtG('REKOR: GÜN '+REKOR.gun+' - '+REKOR.tl+' TL',W/2,398,8,'#ffd75e','center');
  txt('M: SES AÇ/KAPA',W/2,426,8,'#4a5268','center');
  if(click){click=null;startGame();}
}
function drawDayIntro(){
  ctx.fillStyle='rgba(6,8,16,0.66)'; ctx.fillRect(0,0,W,H);
  txtG('GÜN '+G.day,W/2,118,24,'#ffd75e','center');
  txt('MÜŞTERİ SAYISI: '+G.musteriSayisi,W/2,172,8,'#ffffff','center');
  G.yeniUrunler.forEach((ad,i)=>{
    txtG('YENİ ÜRÜN: '+ad+'!',W/2,202+i*20,8,'#8dff9a','center');
  });
  if(G.t>0.5&&Math.floor(T*2)%2)txt('(ENTER)',W/2,296,8,'#7f89a6','center');
  if(click&&G.t>0.5){click=null;beginServe();}
}
function drawDayEnd(){
  ctx.fillStyle='rgba(6,8,16,0.72)'; ctx.fillRect(0,0,W,H);
  const x=200,y=52,w=400,h=340;
  rect(x,y,w,h,'#141a2e');
  ctx.strokeStyle='#ffd75e'; ctx.lineWidth=3; ctx.strokeRect(x+4,y+4,w-8,h-8);
  txtG('GÜN '+G.day+' RAPORU',W/2,y+22,16,'#ffd75e','center');
  const satirlar=[
    ['DOĞRU SİPARİŞ',String(G.gunDogru)],
    ['YANLIŞ GİRİŞ',String(G.gunYanlis)],
    ['KAÇAN MÜŞTERİ',String(G.gunKacan)],
    ['GÜNÜN KAZANCI',G.gunKazanc+' TL'],
    ['TOPLAM KASA',G.money+' TL'],
    ['İTİBAR',G.rep+' / 100'],
  ];
  satirlar.forEach((s,i)=>{
    txt(s[0],x+40,y+72+i*26,8,'#c8d0e8');
    txt(s[1],x+w-40,y+72+i*26,8,'#ffd75e','right');
  });
  if(G.prima)txtG('KUSURSUZ GÜN! ÇAKMAZOĞLU PRİMASI +20 TL',W/2,y+238,8,'#8dff9a','center');
  if(G.yeniRekorF)txtG('YENİ REKOR!',W/2,y+260,8,'#ff8a7a','center');
  if(button(W/2-120,y+290,240,28,'#2fbd4f','#46d86a','SIRADAKİ GÜN','#04140a',false,'#0a3a16')){
    startDay(G.day+1);
  }
}
function drawGameOver(){
  ctx.fillStyle='rgba(40,6,6,0.85)'; ctx.fillRect(0,0,W,H);
  txt('MCT KOVULDU!',W/2+4,120+4,32,'#300804','center');
  txt('MCT KOVULDU!',W/2,120,32,'#ff5a4a','center');
  txt('İtibar sıfırlandı. Çakmazoğlu Holding çok üzüldü.',W/2,182,8,'#e8c8c0','center');
  txt('GÖRÜLEN GÜN: '+G.day,W/2,232,8,'#ffffff','center');
  txt('TOPLAM KAZANÇ: '+G.money+' TL',W/2,255,8,'#ffd75e','center');
  txt('TOPLAM DOĞRU SİPARİŞ: '+G.toplamDogru,W/2,278,8,'#8dff9a','center');
  if(G.yeniRekorF)txtG('YENİ REKOR: GÜN '+REKOR.gun,W/2,308,8,'#ffd75e','center');
  if(button(W/2-110,346,220,28,'#c03028','#e05048','TEKRAR DENE','#ffe0dc',false,'#5a1410')){
    toTitle();
  }
}

/* ---------- ana çizim ---------- */
function render(){
  ctx.save();
  if(G.shake>0)ctx.translate(Math.round((Math.random()*2-1)*G.shake),
                             Math.round((Math.random()*2-1)*G.shake));
  if(G.phase==='title'){
    drawTitle();
  }else{
    drawBG(T);
    // arka masa + muhasebeci abla (otururken masası bacaklarını kapatır)
    if(G.muhasebe&&G.muhasebe.durum==='otur')drawCustomer(G.muhasebe,T);
    drawArkaMasa();
    if(G.muhasebe&&(G.muhasebe.durum==='cikiyor'||G.muhasebe.durum==='donuyor')){
      drawCustomer(G.muhasebe,T); // yürürken MCT'nin ve masaların arkasından geçer
    }
    drawMCT(T,G.mctMood);
    drawDesk(T);
    drawEller(T,G.mctMood);
    if(G.ziyaretci)drawCustomer(G.ziyaretci,T);
    if(G.cust)drawCustomer(G.cust,T);
    if(G.cust&&(G.cust.sub==='talk'||G.cust.sub==='order'))drawBubble(G.cust);
    if(G.ziyaretci&&G.ziyaretci.sub==='talk')drawZiyaretciBalonu(G.ziyaretci);
    drawHUD();
    drawFloats();
    drawPanel();
    if(G.phase==='dayintro')drawDayIntro();
    else if(G.phase==='dayend')drawDayEnd();
    else if(G.phase==='gameover')drawGameOver();
  }
  ctx.restore();
}

/* ---------- döngü ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0.016);
  last=ts;
  hoverVar=false;
  update(dt);
  render();
  canvas.style.cursor=hoverVar?'pointer':'default';
  for(const k in pressed)pressed[k]=false;
  click=null;
  requestAnimationFrame(loop);
}
toTitle();
requestAnimationFrame(loop);
</script>
